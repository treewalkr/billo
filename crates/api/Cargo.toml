[package]
name = "billo-api"
description = "Billo shared request/response types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["serde"] }
# Dates as "YYYY-MM-DD", timestamps as RFC 3339.
time = { version = "0.3", default-features = false, features = ["serde-human-readable", "serde-well-known"] }
# JSON Schemas for the server's OpenAPI docs; the app leaves this off.
schemars = { version = "1", optional = true, features = ["uuid1"] }

[features]
schema = ["dep:schemars"]

[dev-dependencies]
time = { version = "0.3", features = ["macros"] }

[lints]
workspace = true
