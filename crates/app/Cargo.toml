[package]
name = "billo-app"
description = "Billo app: one Dioxus UI for web, iOS and Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = ["web"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[dependencies]
billo-api = { path = "../api" }
billo-domain = { path = "../domain" }
dioxus = { version = "0.7.10" }
form_urlencoded = "1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await-macro"] }
# Plain HTTP only for now (no TLS backend): the browser's fetch on wasm, hyper on native.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["macros"] }
uuid = { version = "1", features = ["v7", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
idb = "0.6.5"
js-sys = "0.3"
uuid = { version = "1", features = ["v7", "serde", "js"] }
# `OffsetDateTime::now_utc` through the browser clock.
time = { version = "0.3", default-features = false, features = ["macros", "wasm-bindgen"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3", features = ["Window", "Storage", "Navigator", "Event", "EventTarget", "Location", "History", "Document", "Element"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
rusqlite = { version = "0.39", features = ["bundled"] }
sys-locale = "0.3"
time = { version = "0.3", features = ["std", "local-offset", "macros"] }
tokio = { version = "1.54.1", default-features = false, features = ["time"] }

[build-dependencies]
toml = "1"

[lints]
workspace = true
