[package]
name = "billo-app"
description = "Billo app: one Dioxus UI for web, iOS and Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = ["web"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[dependencies]
billo-api = { path = "../api" }
billo-domain = { path = "../domain" }
dioxus = { version = "0.7.10" }
# Plain HTTP only for now (no TLS backend): the browser's fetch on wasm, hyper on native.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["macros"] }
uuid = { version = "1", features = ["v7", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
uuid = { version = "1", features = ["v7", "serde", "js"] }
web-sys = { version = "0.3", features = ["Window", "Storage", "Navigator"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
sys-locale = "0.3"
time = { version = "0.3", features = ["std", "local-offset", "macros"] }

[lints]
workspace = true
