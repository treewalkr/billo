services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: billo
      POSTGRES_PASSWORD: billo
      POSTGRES_DB: billo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billo -d billo"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    environment:
      DATABASE_URL: postgres://billo:billo@postgres:5432/billo
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
      # Dev only: lets the `dx serve` web app call the API.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      # Dev only: password-less sign-in via POST /api/v1/auth/dev-login. Never in production.
      DEV_LOGIN: ${DEV_LOGIN:-true}
      # Dev only: API reference at /api/docs, OpenAPI spec at /api/openapi.json.
      API_DOCS: ${API_DOCS:-true}
      # Google sign-in: on when client id + secret are set (read from .env, never committed).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      APP_REDIRECT_ORIGINS: ${APP_REDIRECT_ORIGINS:-http://localhost:8081}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
